# Helm values for kube-prometheus-stack.
# Delivered to the HelmRelease as a ConfigMap (see kustomization.yaml). Any change to this
# file changes the ConfigMap name hash, which makes Flux upgrade the release.

# k3s embeds these control-plane components in a single process and does not
# expose them as scrapeable pods; their targets would permanently show as down.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

defaultRules:
  disabled:
    # False positive on k3d / Docker Desktop: the node container's clock is synced by the
    # host VM, not by NTP inside Linux, so node-exporter always reports "not synchronised".
    NodeClockNotSynchronising: true

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors/PodMonitors/PrometheusRules from any namespace,
    # not only those labelled with this Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    # Persist the TSDB so metrics history survives pod restarts. retentionSize stays below
    # the volume size to leave room for the WAL and compaction; whichever limit hits first wins.
    # local-path volumes cannot be expanded, so the size includes headroom.
    retention: 7d
    retentionSize: 8GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi

# Requests/limits below are sized from observed peak usage (container_memory_working_set_bytes
# and CPU rate over the first 2h) with headroom. No CPU limits: they cause throttling even
# when the node has spare CPU; a CPU request plus a memory limit is enough.

# Peak 25Mi / 14m.
prometheusOperator:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# Peak 25Mi / 5m.
kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# Peak 12Mi / 3m.
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi

# No adminPassword here: the chart generates one into the Secret
# kube-prometheus-stack-grafana, so no credential is stored in Git.
grafana:
  # Steady ~550-600Mi, peak 705Mi (grows with the number of dashboards).
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 1Gi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      # Put each dashboard into the Grafana folder named by this ConfigMap annotation.
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
