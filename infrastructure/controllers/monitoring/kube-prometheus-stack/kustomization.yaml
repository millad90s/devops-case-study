apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - repository.yaml
  - release.yaml
# values.yaml is wrapped into a ConfigMap with a content hash in its name; kustomizeconfig.yaml
# rewrites the HelmRelease's valuesFrom to match, so editing values triggers a Helm upgrade.
configMapGenerator:
  - name: kube-prometheus-stack-values
    files:
      - values.yaml
configurations:
  - kustomizeconfig.yaml
