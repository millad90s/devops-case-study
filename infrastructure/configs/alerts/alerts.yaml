# Cause and blind-spot alerts. User-facing symptoms (errors, latency) are covered by the
# Sloth SLO burn-rate alerts; platform issues by the kube-prometheus-stack default rules.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: app-alerts
  namespace: monitoring
spec:
  groups:
    - name: app-alerts
      rules:
        # If every pod is gone there are no metrics at all, so the SLO alerts see "no data"
        # and stay silent. `absent()` covers targets that disappeared completely.
        - alert: AppDown
          expr: |
            (sum by (job) (up{job=~"backend-api|ml-api"}) == 0)
            or absent(up{job="backend-api"})
            or absent(up{job="ml-api"})
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.job }} is down: Prometheus cannot scrape any of its pods."
            description: "No healthy target for {{ $labels.job }} for 2 minutes. Check the pods and recent events in its namespace."

        # The cause behind backend-api 5xx: points straight to the database instead of the API.
        - alert: BackendApiDbQueryErrors
          expr: |
            sum(rate(backend_api_db_queries_total{status="error"}[5m]))
            /
            sum(rate(backend_api_db_queries_total[5m]))
            > 0.05
          for: 5m
          labels:
            severity: warning
            team: backend
          annotations:
            summary: "backend-api: {{ $value | humanizePercentage }} of database queries are failing."
            description: "Check the postgres logs in Loki (e.g. missing table, connection refused)."

        # Silent failure: /predict succeeds (so the error-rate SLO stays green) but no
        # predictions are produced.
        - alert: MlApiNoPredictions
          expr: |
            sum(rate(ml_api_requests_total{endpoint="/predict",status=~"2.."}[10m])) > 0
            and
            (sum(rate(ml_api_predictions_total[10m])) or vector(0)) == 0
          for: 10m
          labels:
            severity: warning
            team: ml
          annotations:
            summary: "ml-api answers /predict successfully but makes no predictions."
            description: "Requests succeed but ml_api_predictions_total is not increasing. Check the ML API dashboard and ml-api logs."
