apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
# Dashboards are kept as plain JSON files and wrapped into ConfigMaps that the
# Grafana sidecar discovers via the grafana_dashboard label. The grafana_folder
# annotation sets the Grafana folder each dashboard is placed in.
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  - name: dashboard-backend-api
    files:
      - backend-api/backend-api.json
    options:
      annotations:
        grafana_folder: Backend API
  - name: dashboard-ml-api
    files:
      - ml-api/ml-api.json
    options:
      annotations:
        grafana_folder: ML API
  # Official Sloth dashboards (grafana.com 14643 / 14348), patched to use the $Datasource
  # variable instead of the import-time ${DS_PROMETHEUS} placeholder, and the 4w (28d)
  # SLO period our rules are generated with instead of 30d.
  - name: dashboard-slo-overview
    files:
      - slo/slo-overview.json
    options:
      annotations:
        grafana_folder: SLOs
  - name: dashboard-slo-detail
    files:
      - slo/slo-detail.json
    options:
      annotations:
        grafana_folder: SLOs
