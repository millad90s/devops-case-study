# postgres only accepts connections from backend-api on 5432.
# namespaceSelector and podSelector are in the SAME list item (logical AND): a podSelector
# on its own would only match pods in the postgres namespace.
# The readiness probe is an exec probe, so it is not affected by this policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: postgres
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backend-api
          podSelector:
            matchLabels:
              app: backend-api
      ports:
        - protocol: TCP
          port: 5432
