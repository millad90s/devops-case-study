# Sloth input for the backend-api SLOs in openslo.yaml (OpenSLO v1).
# Sloth v0.16 cannot read openslo/v1, so the same SLIs and targets are expressed here.
# Regenerate the rules after any change (see ../README.md).
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: backend-api
  namespace: monitoring
spec:
  service: backend-api
  labels:
    team: backend
  slos:
    - name: process-availability
      objective: 99.5
      description: 99.5% of POST /process requests do not return a 5xx.
      sli:
        events:
          # `or vector(0)`: with no 5xx since the pods started the series doesn't exist,
          # and the SLI would be empty instead of 0 errors.
          errorQuery: (sum(rate(backend_api_requests_total{endpoint="/process",status=~"5.."}[{{.window}}])) or vector(0))
          totalQuery: sum(rate(backend_api_requests_total{endpoint="/process"}[{{.window}}]))
      alerting:
        name: BackendApiAvailabilityBudgetBurn
        labels:
          category: availability
        annotations:
          summary: backend-api /process is burning its availability error budget too fast.
          runbook: Check the Backend API dashboard (errors, DB queries) and backend-api and postgres logs in Loki.
        pageAlert:
          labels:
            severity: critical
        ticketAlert:
          labels:
            severity: warning

    - name: process-latency
      objective: 99
      description: 99% of POST /process requests complete within 250ms.
      sli:
        events:
          # "Bad" events are requests slower than 250ms: total minus the le=0.25 bucket.
          errorQuery: |
            sum(rate(backend_api_request_duration_seconds_count{endpoint="/process"}[{{.window}}]))
            -
            sum(rate(backend_api_request_duration_seconds_bucket{endpoint="/process",le="0.25"}[{{.window}}]))
          totalQuery: sum(rate(backend_api_request_duration_seconds_count{endpoint="/process"}[{{.window}}]))
      alerting:
        name: BackendApiLatencyBudgetBurn
        labels:
          category: latency
        annotations:
          summary: backend-api /process is burning its latency error budget too fast.
          runbook: Check the Backend API dashboard (latency, DB queries, CPU) for saturation.
        pageAlert:
          disable: true
        ticketAlert:
          labels:
            severity: warning
