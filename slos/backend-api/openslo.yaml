# OpenSLO v1 SLOs for backend-api. Shared objects are in ../common/openslo.yaml.
#
# - Only user traffic on POST /process counts; probes (/health, /ready) are excluded.
# - ratioMetric with counter: true: queries return raw counters, the tool applies rate().
# - Latency threshold 250ms: today 99.7% of requests finish within 50ms and 100% within
#   100ms, so 250ms (an existing histogram bucket) leaves headroom for real DB work.
apiVersion: openslo/v1
kind: Service
metadata:
  name: backend-api
  displayName: Backend API
spec:
  description: Processes documents via POST /process and stores them in PostgreSQL.
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: backend-api-availability
  displayName: Backend API availability
spec:
  description: 99.5% of /process requests succeed (non-5xx) over a rolling 28 days.
  service: backend-api
  budgetingMethod: Occurrences
  timeWindow:
    - duration: 28d
      isRolling: true
  indicator:
    metadata:
      name: backend-api-process-success-ratio
      displayName: /process non-5xx ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            metricSourceRef: prometheus
            type: Prometheus
            spec:
              query: sum(backend_api_requests_total{endpoint="/process", status!~"5.."})
        total:
          metricSource:
            metricSourceRef: prometheus
            type: Prometheus
            spec:
              query: sum(backend_api_requests_total{endpoint="/process"})
  objectives:
    - displayName: Available
      target: 0.995
  alertPolicies:
    - alertPolicyRef: page-on-fast-burn
    - alertPolicyRef: ticket-on-slow-burn
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: backend-api-latency
  displayName: Backend API latency
spec:
  description: 99% of /process requests complete within 250ms over a rolling 28 days.
  service: backend-api
  budgetingMethod: Occurrences
  timeWindow:
    - duration: 28d
      isRolling: true
  indicator:
    metadata:
      name: backend-api-process-fast-ratio
      displayName: /process requests under 250ms
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            metricSourceRef: prometheus
            type: Prometheus
            spec:
              query: sum(backend_api_request_duration_seconds_bucket{endpoint="/process", le="0.25"})
        total:
          metricSource:
            metricSourceRef: prometheus
            type: Prometheus
            spec:
              query: sum(backend_api_request_duration_seconds_count{endpoint="/process"})
  objectives:
    - displayName: Fast enough
      target: 0.99
  alertPolicies:
    - alertPolicyRef: ticket-on-slow-burn
