# OpenSLO v1 objects shared by all services: data source, burn-rate alert conditions and
# notification targets. Service SLOs are in ../<service>/openslo.yaml.
#
# OpenSLO is a vendor-neutral specification, not a Kubernetes resource: Flux does not apply
# these files. A generator (e.g. Sloth) or an SLO platform turns them into rules and alerts.
apiVersion: openslo/v1
kind: DataSource
metadata:
  name: prometheus
  displayName: In-cluster Prometheus
spec:
  type: Prometheus
  description: kube-prometheus-stack Prometheus in the monitoring namespace.
  connectionDetails:
    url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
---
# Multi-window burn-rate conditions (Google SRE workbook).
apiVersion: openslo/v1
kind: AlertCondition
metadata:
  name: fast-burn
  displayName: Fast burn (2% of the budget in 1h)
spec:
  description: Budget is burning 14.4x faster than sustainable; users are impacted now.
  severity: page
  condition:
    kind: burnrate
    op: gte
    threshold: 14.4
    lookbackWindow: 1h
    alertAfter: 5m
---
apiVersion: openslo/v1
kind: AlertCondition
metadata:
  name: slow-burn
  displayName: Slow burn (10% of the budget in 3d)
spec:
  description: Budget is leaking steadily; fix during working hours.
  severity: ticket
  condition:
    kind: burnrate
    op: gte
    threshold: 1
    lookbackWindow: 3d
    alertAfter: 6h
---
apiVersion: openslo/v1
kind: AlertNotificationTarget
metadata:
  name: oncall-pager
spec:
  description: On-call rotation (e.g. PagerDuty via Alertmanager).
  target: pagerduty
---
apiVersion: openslo/v1
kind: AlertNotificationTarget
metadata:
  name: team-slack
spec:
  description: Owning team's channel for non-urgent reliability work.
  target: slack
---
apiVersion: openslo/v1
kind: AlertPolicy
metadata:
  name: page-on-fast-burn
  displayName: Page on fast budget burn
spec:
  description: Wake someone up when users are being hurt right now.
  alertWhenBreaching: true
  alertWhenResolved: true
  conditions:
    - conditionRef: fast-burn
  notificationTargets:
    - targetRef: oncall-pager
---
apiVersion: openslo/v1
kind: AlertPolicy
metadata:
  name: ticket-on-slow-burn
  displayName: Ticket on slow budget burn
spec:
  description: Open a ticket when the budget is consumed faster than it refills.
  alertWhenBreaching: true
  alertWhenResolved: true
  conditions:
    - conditionRef: slow-burn
  notificationTargets:
    - targetRef: team-slack
