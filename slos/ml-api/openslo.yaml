# OpenSLO v1 SLOs for ml-api. Shared objects are in ../common/openslo.yaml.
#
# - Only user traffic on POST /predict counts; probes (/health, /ready) are excluded.
# - ratioMetric with counter: true: queries return raw counters, the tool applies rate().
# - Latency threshold 1s: today 100% of requests finish within 0.5s, but they sit right at
#   that histogram bucket edge, so 500ms would leave no headroom. 1s is the next bucket.
apiVersion: openslo/v1
kind: Service
metadata:
  name: ml-api
  displayName: ML API
spec:
  description: Serves predictions via POST /predict.
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: ml-api-availability
  displayName: ML API availability
spec:
  description: 99.5% of /predict requests succeed (non-5xx) over a rolling 28 days.
  service: ml-api
  budgetingMethod: Occurrences
  timeWindow:
    - duration: 28d
      isRolling: true
  indicator:
    metadata:
      name: ml-api-predict-success-ratio
      displayName: /predict non-5xx ratio
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            metricSourceRef: prometheus
            type: Prometheus
            spec:
              query: sum(ml_api_requests_total{endpoint="/predict", status!~"5.."})
        total:
          metricSource:
            metricSourceRef: prometheus
            type: Prometheus
            spec:
              query: sum(ml_api_requests_total{endpoint="/predict"})
  objectives:
    - displayName: Available
      target: 0.995
  alertPolicies:
    - alertPolicyRef: page-on-fast-burn
    - alertPolicyRef: ticket-on-slow-burn
---
apiVersion: openslo/v1
kind: SLO
metadata:
  name: ml-api-latency
  displayName: ML API latency
spec:
  description: 99% of /predict requests complete within 1s over a rolling 28 days.
  service: ml-api
  budgetingMethod: Occurrences
  timeWindow:
    - duration: 28d
      isRolling: true
  indicator:
    metadata:
      name: ml-api-predict-fast-ratio
      displayName: /predict requests under 1s
    spec:
      ratioMetric:
        counter: true
        good:
          metricSource:
            metricSourceRef: prometheus
            type: Prometheus
            spec:
              query: sum(ml_api_request_duration_seconds_bucket{endpoint="/predict", le="1.0"})
        total:
          metricSource:
            metricSourceRef: prometheus
            type: Prometheus
            spec:
              query: sum(ml_api_request_duration_seconds_count{endpoint="/predict"})
  objectives:
    - displayName: Fast enough
      target: 0.99
  alertPolicies:
    - alertPolicyRef: ticket-on-slow-burn
